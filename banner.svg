<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Guillaume Fouquier – Réseaux, Infrastructures, Cybersécurité">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0A1E46"/>
<stop offset="1" stop-color="#00B7D4"/>
</linearGradient>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
.n{font-size:50px;font-weight:700}
.s{font-size:26px;opacity:0}
.a1{animation:c 9s infinite}
.a2{animation:c 9s infinite 3s}
.a3{animation:c 9s infinite 6s}
@keyframes c{0%{opacity:0}6%,30%{opacity:1}36%,100%{opacity:0}}
.l{stroke:#35D0EA;stroke-width:3;stroke-linecap:round;stroke-dasharray:300;animation:d 3s ease-in-out infinite alternate}
@keyframes d{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
</style>
<rect width="1000" height="220" rx="12" fill="url(#g)"/>
<text x="500" y="98" class="n">Guillaume Fouquier</text>
<line class="l" x1="350" y1="122" x2="650" y2="122"/>
<text x="500" y="172" class="s a1">Réseaux &amp; Infrastructures</text>
<text x="500" y="172" class="s a2">Cybersécurité</text>
<text x="500" y="172" class="s a3">Alternance dès janvier 2027</text>
</svg>
