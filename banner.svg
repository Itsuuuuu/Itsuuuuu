<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Guillaume Fouquier - Réseaux et Infrastructures, Cybersécurité">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a6cff"/>
      <stop offset="0.55" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="h" cx="0.2" cy="0" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .n { font-size: 54px; font-weight: 600; letter-spacing: -1.5px; fill: #ffffff; }
      .s { font-size: 23px; font-weight: 400; letter-spacing: 0.2px; fill: #ffffff; fill-opacity: 0.95; }
      .p { font-size: 16px; font-weight: 600; fill: #ffffff; }
      .pill { fill: #0a6cff; animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    </style>
  </defs>
  <rect width="1000" height="220" rx="28" fill="url(#g)"/>
  <rect width="1000" height="220" rx="28" fill="url(#h)"/>
  <text x="500" y="88" class="n">Guillaume Fouquier</text>
  <text x="500" y="130" class="s">Réseaux &amp; Infrastructures · Cybersécurité</text>
  <rect x="370" y="158" width="260" height="38" rx="19" class="pill"/>
  <text x="500" y="182" class="p">Alternance dès janvier 2027</text>
</svg>
