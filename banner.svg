<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Guillaume Fouquier - Réseaux et Infrastructures, Cybersécurité">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5fe8"/>
      <stop offset="0.4" stop-color="#2f8cff"/>
      <stop offset="0.75" stop-color="#a9d3ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="260" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="aura" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="aura2" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .n { font-size: 54px; font-weight: 600; letter-spacing: -1.5px; animation: float 5s ease-in-out infinite alternate; }
      .s { font-size: 23px; font-weight: 500; letter-spacing: 0.2px; animation: breathe 4s ease-in-out infinite; }
      .p { font-size: 16px; font-weight: 600; fill: #ffffff; }
      .halo { fill: #01245f; fill-opacity: 0.32; }
      .halo2 { fill: #01245f; fill-opacity: 0.12; }
      .w { fill: #ffffff; }
      .l { stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-opacity: 0.9; transform-box: fill-box; transform-origin: center; animation: lp 3s ease-in-out infinite, sweep 6s ease-in-out infinite alternate; }
      .pill { fill: #0a5fe8; animation: pulse 3s ease-in-out infinite; }
      .pt { animation: pulse 3s ease-in-out infinite; }
      .b1 { animation: d1 9s ease-in-out infinite alternate; }
      .b2 { animation: d2 11s ease-in-out infinite alternate; }
      .b3 { animation: d3 13s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-3px); } }
      @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
      @keyframes lp { 0%,100% { stroke-width: 2; } 50% { stroke-width: 4; } }
      @keyframes sweep { from { transform: scaleX(0.7); } to { transform: scaleX(1.15); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
      @keyframes d1 { from { transform: translate(-80px, -30px); } to { transform: translate(260px, -10px); } }
      @keyframes d2 { from { transform: translate(300px, -20px); } to { transform: translate(-120px, 0px); } }
      @keyframes d3 { from { transform: translate(120px, 20px); } to { transform: translate(-220px, 0px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="260" fill="url(#g)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="200" cy="50" r="95" fill="#5ac8fa" fill-opacity="0.75"/>
      <circle class="b2" cx="650" cy="40" r="110" fill="#7d5cff" fill-opacity="0.35"/>
      <circle class="b3" cx="500" cy="210" r="90" fill="#ffffff" fill-opacity="0.45"/>
    </g>
    <g filter="url(#aura2)">
      <text x="500" y="92" class="n halo2">Guillaume Fouquier</text>
      <text x="500" y="148" class="s halo2">Réseaux &amp; Infrastructures · Cybersécurité</text>
    </g>
    <g filter="url(#aura)">
      <text x="500" y="92" class="n halo">Guillaume Fouquier</text>
      <text x="500" y="148" class="s halo">Réseaux &amp; Infrastructures · Cybersécurité</text>
    </g>
  </g>
  <text x="500" y="92" class="n w">Guillaume Fouquier</text>
  <line x1="380" y1="113" x2="620" y2="113" class="l"/>
  <text x="500" y="148" class="s w">Réseaux &amp; Infrastructures · Cybersécurité</text>
  <rect x="370" y="188" width="260" height="38" rx="19" class="pill"/>
  <text x="500" y="212" class="p pt">Alternance dès janvier 2027</text>
</svg>
