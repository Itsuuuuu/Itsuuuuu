<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Guillaume Fouquier – Réseaux, Infrastructures, Cybersécurité">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0A1E46"/>
<stop offset="1" stop-color="#00B7D4"/>
</linearGradient>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
.n{font-size:50px;font-weight:700}
.s{font-size:26px}
.t{font-size:20px;fill:#BDE8F2;animation:p 4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.35}}
.l{stroke:#35D0EA;stroke-width:3;stroke-linecap:round;animation:w 4s ease-in-out infinite}
@keyframes w{0%,100%{stroke-width:3}50%{stroke-width:6}}
</style>
<rect width="1000" height="220" rx="12" fill="url(#g)"/>
<text x="500" y="98" class="n">Guillaume Fouquier</text>
<line class="l" x1="350" y1="122" x2="650" y2="122"/>
<text x="500" y="165" class="s">Réseaux &amp; Infrastructures · Cybersécurité</text>
<text x="500" y="200" class="t">Alternance dès janvier 2027</text>
</svg>
